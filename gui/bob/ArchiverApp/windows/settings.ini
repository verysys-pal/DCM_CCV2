# ===== Core/User folder (기본값 유지) =====
# 사용자 폴더/캐시는 기본값(.phoebus) 사용. 별도 지정 불요.

# ===== Display Builder (누락된 기본 키 보강) =====
org.csstudio.display.builder.model/enable_svg_rendering_resolution_factor=false
org.csstudio.display.builder.model/svg_rendering_resolution_factor=1.0

# ===== ChannelFinder (로컬에 서비스 없으면 완전 비활성화 권장) =====
org.phoebus.channelfinder/enable=false
org.phoebus.channelfinder/service_url=
org.phoebus.channelfinder/search_url=

# ===== Logbook (미사용 시 비활성화) =====
org.phoebus.logbook/implementation=None

# ===== (선택) 첫 화면·UI 잡음 줄이기 =====
org.phoebus.ui/startup/restore_previous_state=false

# ===== Data Browser → Archiver Appliance 연결 =====
# 여러 소스를 쓸 때는 * 로 이어붙입니다. 각 URL 뒤에 |별칭 을 붙이면 UI에서 구분이 쉽습니다.
# pbraw 스킴은 Phoebus에서 Archiver Appliance Retrieval을 의미합니다.
org.csstudio.trends.databrowser3/urls=pbraw://192.168.97.37:17668/retrieval/|AA
org.csstudio.trends.databrowser3/archives=pbraw://192.168.97.37:17668/retrieval/|AA
org.csstudio.trends.databrowser3/use_default_archives=true